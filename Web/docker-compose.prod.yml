services:
  db-prod:
    image: postgres:16
    container_name: web-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - web_pgdata_prod:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-prod:
    image: ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}
    container_name: web-api-prod
    restart: unless-stopped
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db-prod;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Port=5432
      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-false}
    ports:
      - "5003:8080"
    networks:
      - default
      - web-proxy

networks:
  web-proxy:
    name: web-proxy

volumes:
  web_pgdata_prod:
