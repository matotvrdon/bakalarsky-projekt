services:
  caddy:
    image: caddy:2.8-alpine
    container_name: web-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
      CADDY_DOMAIN_PROD: ${CADDY_DOMAIN_PROD:?CADDY_DOMAIN_PROD is required}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web-proxy

networks:
  web-proxy:
    name: web-proxy

volumes:
  caddy_data:
  caddy_config:
