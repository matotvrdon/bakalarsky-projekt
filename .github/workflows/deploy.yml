name: Deploy

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - Development
          - Test
          - Production

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Web.sln
        working-directory: Web

      - name: Build
        run: dotnet build Web.sln --no-restore --configuration Release
        working-directory: Web

      - name: Run tests
        run: dotnet test Web.sln --no-build --configuration Release --verbosity normal
        working-directory: Web

  set-matrix:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_deploy: ${{ steps.set-matrix.outputs.should_deploy }}
    steps:
      - name: Determine deployment matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref_name }}" in
              dev)
                echo 'matrix={"include":[{"env":"Development","branch":"dev","compose":"docker-compose.dev.yml","image_tag":"dev-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              test)
                echo 'matrix={"include":[{"env":"Test","branch":"test","compose":"docker-compose.test.yml","image_tag":"test-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              main)
                echo 'matrix={"include":[{"env":"Production","branch":"main","compose":"docker-compose.prod.yml","image_tag":"prod-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              *)
                echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=false' >> $GITHUB_OUTPUT
                ;;
            esac
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              Development)
                echo 'matrix={"include":[{"env":"Development","branch":"dev","compose":"docker-compose.dev.yml","image_tag":"dev-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              Test)
                echo 'matrix={"include":[{"env":"Test","branch":"test","compose":"docker-compose.test.yml","image_tag":"test-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              Production)
                echo 'matrix={"include":[{"env":"Production","branch":"main","compose":"docker-compose.prod.yml","image_tag":"prod-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              *)
                echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=false' >> $GITHUB_OUTPUT
                ;;
            esac
          else
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo 'should_deploy=false' >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: set-matrix
    if: needs.set-matrix.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ matrix.image_tag }}
      COMPOSE_FILE: ${{ matrix.compose }}
      DEPLOY_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image repo
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV_LOWER=$(echo '${{ matrix.env }}' | tr '[:upper:]' '[:lower:]' | sed 's/production/prod/' | sed 's/development/dev/')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Write SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${SSH_PORT:-22}"
          echo "Scanning SSH host keys for $SSH_HOST on port $SSH_PORT..."
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "::warning::ssh-keyscan failed, adding host to known_hosts with StrictHostKeyChecking disabled"
            echo "Host $SSH_HOST" >> ~/.ssh/config
            echo "  StrictHostKeyChecking no" >> ~/.ssh/config
            echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          }
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure remote directory
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p /srv/web-api/docker"

      - name: Sync compose files
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          rsync -az -e "ssh -p $SSH_PORT" \
            Web/docker-compose.dev.yml \
            Web/docker-compose.test.yml \
            Web/docker-compose.prod.yml \
            Web/docker-compose.proxy.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/web-api/"
          rsync -az -e "ssh -p $SSH_PORT" \
            Web/docker/Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/web-api/docker/"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_AUTO_MIGRATE: ${{ secrets.DATABASE_AUTO_MIGRATE }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          DATABASE_AUTO_MIGRATE="${DATABASE_AUTO_MIGRATE:-false}"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             IMAGE_REPO='${IMAGE_REPO}' IMAGE_TAG='${IMAGE_TAG}' \
             POSTGRES_USER='${POSTGRES_USER}' POSTGRES_PASSWORD='${POSTGRES_PASSWORD}' POSTGRES_DB='${POSTGRES_DB}' \
             DATABASE_AUTO_MIGRATE='${DATABASE_AUTO_MIGRATE}' \
             COMPOSE_PROJECT_NAME='web-${DEPLOY_ENV_LOWER}' \
             docker compose -f /srv/web-api/${COMPOSE_FILE} pull && \
             IMAGE_REPO='${IMAGE_REPO}' IMAGE_TAG='${IMAGE_TAG}' \
             POSTGRES_USER='${POSTGRES_USER}' POSTGRES_PASSWORD='${POSTGRES_PASSWORD}' POSTGRES_DB='${POSTGRES_DB}' \
             DATABASE_AUTO_MIGRATE='${DATABASE_AUTO_MIGRATE}' \
             COMPOSE_PROJECT_NAME='web-${DEPLOY_ENV_LOWER}' \
             docker compose -f /srv/web-api/${COMPOSE_FILE} up -d"

      - name: Cleanup old Docker images
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker image prune -af --filter 'until=168h' || true"
