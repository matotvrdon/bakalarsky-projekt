name: Deploy

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - Development
          - Test
          - Production

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Web.sln
        working-directory: Web

      - name: Build
        run: dotnet build Web.sln --no-restore --configuration Release
        working-directory: Web

      - name: Run tests
        run: dotnet test Web.sln --no-build --configuration Release --verbosity normal
        working-directory: Web

  set-matrix:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_deploy: ${{ steps.set-matrix.outputs.should_deploy }}
    steps:
      - name: Determine deployment matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref_name }}" in
              dev)
                echo 'matrix={"include":[{"env":"Development","deploy_env":"dev","image_tag":"dev-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              test)
                echo 'matrix={"include":[{"env":"Test","deploy_env":"test","image_tag":"test-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              main)
                echo 'matrix={"include":[{"env":"Production","deploy_env":"prod","image_tag":"prod-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              Development)
                echo 'matrix={"include":[{"env":"Development","deploy_env":"dev","image_tag":"dev-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              Test)
                echo 'matrix={"include":[{"env":"Test","deploy_env":"test","image_tag":"test-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              Production)
                echo 'matrix={"include":[{"env":"Production","deploy_env":"prod","image_tag":"prod-latest"}]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
                echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
          fi

  build-image:
    needs: set-matrix
    if: needs.set-matrix.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ matrix.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image repo
        run: echo "BACKEND_IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.BACKEND_IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}

  deploy:
    needs: [set-matrix, build-image]
    if: needs.set-matrix.outputs.should_deploy == 'true'
    runs-on: [self-hosted, conference-prod]
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    environment: ${{ matrix.env }}
    env:
      DEPLOY_ENV: ${{ matrix.deploy_env }}
      IMAGE_TAG: ${{ matrix.image_tag }}
      DEPLOY_DIR: /home/student1/conference-app
      BACKEND_IMAGE_REPO: matotvrdon/bakalarsky-projekt
      FRONTEND_IMAGE_REPO: matotvrdon/bakalarsky-projekt-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin

      - name: Prepare deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cp deploy/docker-compose.proxy.yml "$DEPLOY_DIR/docker-compose.proxy.yml"
          cp deploy/Caddyfile "$DEPLOY_DIR/Caddyfile"

      - name: Pull and deploy
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_AUTO_MIGRATE: ${{ secrets.DATABASE_AUTO_MIGRATE }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_LOGIN_URL: ${{ secrets.EMAIL_LOGIN_URL }}
          EMAIL_SECURE_SOCKET_OPTION: ${{ secrets.EMAIL_SECURE_SOCKET_OPTION }}
        run: |
          docker network inspect conference-public >/dev/null 2>&1 || docker network create conference-public

          for container in conference-api conference-frontend; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker network connect conference-public "$container" 2>/dev/null || true
            fi
          done

          export DEPLOY_ENV="${DEPLOY_ENV}"
          export COMPOSE_PROJECT_NAME="conference-${DEPLOY_ENV}"
          if [ "$DEPLOY_ENV" = "prod" ]; then
            export PGDATA_VOLUME=conference_pgdata
            export STORAGE_VOLUME=conference_storage
          else
            export PGDATA_VOLUME="conference_${DEPLOY_ENV}_pgdata"
            export STORAGE_VOLUME="conference_${DEPLOY_ENV}_storage"
          fi
          export IMAGE_TAG="${IMAGE_TAG}"
          export BACKEND_IMAGE_REPO="${BACKEND_IMAGE_REPO}"
          export FRONTEND_IMAGE_REPO="${FRONTEND_IMAGE_REPO}"
          export POSTGRES_USER="${POSTGRES_USER}"
          export POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
          export POSTGRES_DB="${POSTGRES_DB}"
          export DATABASE_AUTO_MIGRATE="${DATABASE_AUTO_MIGRATE:-true}"
          export EMAIL_HOST="${EMAIL_HOST}"
          export EMAIL_PORT="${EMAIL_PORT:-587}"
          export EMAIL_USERNAME="${EMAIL_USERNAME}"
          export EMAIL_PASSWORD="${EMAIL_PASSWORD}"
          export EMAIL_FROM_ADDRESS="${EMAIL_FROM_ADDRESS}"
          export EMAIL_FROM_NAME="${EMAIL_FROM_NAME}"
          export EMAIL_LOGIN_URL="${EMAIL_LOGIN_URL}"
          export EMAIL_SECURE_SOCKET_OPTION="${EMAIL_SECURE_SOCKET_OPTION:-StartTls}"

          docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull
          docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

          current_proxy_project=""
          if docker container inspect conference-caddy >/dev/null 2>&1; then
            current_proxy_project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' conference-caddy 2>/dev/null || true)"
          fi

          if [ "$DEPLOY_ENV" = "prod" ] || [ "$current_proxy_project" = "conference-proxy" ] || [ -z "$current_proxy_project" ]; then
            if [ -n "$current_proxy_project" ] && [ "$current_proxy_project" != "conference-proxy" ]; then
              docker rm -f conference-caddy
            fi

            export COMPOSE_PROJECT_NAME=conference-proxy
            docker compose -f "$DEPLOY_DIR/docker-compose.proxy.yml" up -d
            docker exec conference-caddy caddy reload --config /etc/caddy/Caddyfile || docker restart conference-caddy
          else
            echo "Keeping legacy conference-caddy until Production deploy initializes the shared proxy."
          fi

      - name: Show deployment status
        run: |
          export DEPLOY_ENV="${DEPLOY_ENV}"
          export COMPOSE_PROJECT_NAME="conference-${DEPLOY_ENV}"
          if [ "$DEPLOY_ENV" = "prod" ]; then
            export PGDATA_VOLUME=conference_pgdata
            export STORAGE_VOLUME=conference_storage
          else
            export PGDATA_VOLUME="conference_${DEPLOY_ENV}_pgdata"
            export STORAGE_VOLUME="conference_${DEPLOY_ENV}_storage"
          fi
          docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps
          docker compose -f "$DEPLOY_DIR/docker-compose.yml" logs --tail=80 api
          docker ps --filter "name=conference" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          if docker container inspect conference-caddy >/dev/null 2>&1; then
            docker logs --tail=80 conference-caddy
          fi

      - name: Cleanup old Docker images
        run: docker image prune -af --filter 'until=168h' || true
