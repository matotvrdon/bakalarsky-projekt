name: Deploy

on:
  push:
    branches:
      - dev
      - test
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - Development
          - Test
          - Production

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Web.sln
        working-directory: Web

      - name: Build
        run: dotnet build Web.sln --no-restore --configuration Release
        working-directory: Web

      - name: Run tests
        run: dotnet test Web.sln --no-build --configuration Release --verbosity normal
        working-directory: Web

  set-matrix:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_deploy: ${{ steps.set-matrix.outputs.should_deploy }}
    steps:
      - name: Determine deployment matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref_name }}" in
              dev)
                echo 'matrix={"include":[{"env":"Development","branch":"dev","compose":"docker-compose.dev.yml","image_tag":"dev-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              test)
                echo 'matrix={"include":[{"env":"Test","branch":"test","compose":"docker-compose.test.yml","image_tag":"test-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              main)
                echo 'matrix={"include":[{"env":"Production","branch":"main","compose":"docker-compose.prod.yml","image_tag":"prod-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              *)
                echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=false' >> $GITHUB_OUTPUT
                ;;
            esac
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              Development)
                echo 'matrix={"include":[{"env":"Development","branch":"dev","compose":"docker-compose.dev.yml","image_tag":"dev-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              Test)
                echo 'matrix={"include":[{"env":"Test","branch":"test","compose":"docker-compose.test.yml","image_tag":"test-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              Production)
                echo 'matrix={"include":[{"env":"Production","branch":"main","compose":"docker-compose.prod.yml","image_tag":"prod-latest"}]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=true' >> $GITHUB_OUTPUT
                ;;
              *)
                echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
                echo 'should_deploy=false' >> $GITHUB_OUTPUT
                ;;
            esac
          else
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo 'should_deploy=false' >> $GITHUB_OUTPUT
          fi

  push-image:
    needs: set-matrix
    if: needs.set-matrix.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ matrix.image_tag }}
      DEPLOY_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image repo
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "## 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ matrix.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To deploy manually:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8080:8080 ghcr.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
